<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale e o Site Escreve</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin: 15px 0;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }
    .btn-mic { background-color: #007bff; color: white; }
    .btn-mic.recording { background-color: #dc3545; }
    .btn-wsp { background-color: #25d366; color: white; }
  </style>
</head>
<body>

  <h2>🔊 Fale e o Site Escreve</h2>

  <button id="btnRecord" class="btn-mic">🎤 Gravar Mensagem</button>

  <textarea id="output" placeholder="Sua fala aparecerá aqui..."></textarea>

  <br>
  <button id="btnWhatsapp" class="btn-wsp">Enviar no WhatsApp 🚀</button>

  <script>
    const btnRecord = document.getElementById('btnRecord');
    const output = document.getElementById('output');
    const btnWhatsapp = document.getElementById('btnWhatsapp');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Seu navegador não suporta a transcrição de voz.");
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = true;
      recognition.interimResults = true;

      let isRecording = false;

      btnRecord.addEventListener('click', () => {
        if (!isRecording) {
          recognition.start();
          btnRecord.textContent = '🛑 Parar Gravação';
          btnRecord.classList.add('recording');
          isRecording = true;
        } else {
          recognition.stop();
          btnRecord.textContent = '🎤 Gravar Mensagem';
          btnRecord.classList.remove('recording');
          isRecording = false;
        }
      });

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        output.value = transcript;
      };

      recognition.onerror = (event) => {
        console.error("Erro no reconhecimento de voz:", event.error);
      };

      recognition.onend = () => {
        if (isRecording) {
          try { recognition.start(); } catch (e) {}
        }
      };
    }

    btnWhatsapp.addEventListener('click', () => {
      const message = output.value.trim();

      if (message) {
        const text = encodeURIComponent(message);
        window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
      } else {
        alert("Fale ou digite uma mensagem primeiro!");
      }
    });
  </script>
</body>
</html>
